services:
  gcs:
    build:
      context: ./pc
      dockerfile: Dockerfile.gcs

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./pc/src:/app/src:ro

    command:
      - uvicorn
      - hikorobo_gcs.server.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src