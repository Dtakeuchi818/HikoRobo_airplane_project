[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hikorobo-gcs"
version = "0.1.0"
description = "HikoRobo ground-control serial communication test"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
hikorobo-serial = "hikorobo_gcs.serial_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
